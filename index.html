<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CocokRambut AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#000;
      color:#e0f2ff;
      font-family:'Segoe UI',sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:20px;
      overflow:hidden;
      background:radial-gradient(circle at center,#0a1a2e,#000);
    }
    h1{
      font-size:3.5rem;
      font-weight:300;
      letter-spacing:10px;
      color:#fff;
      opacity:0;
      transform:translateY(-40px);
      animation:titleIn 1.2s forwards 0.5s;
    }
    @keyframes titleIn{
      to{opacity:1;transform:translateY(0);}
    }
    p.subtitle{
      font-size:1.15rem;
      color:#88c0ff;
      margin:20px 0 50px;
      opacity:0;
      animation:fadeIn 1s forwards 1s;
    }
    @keyframes fadeIn{to{opacity:1;}}

    .card{
      background:rgba(15,25,50,0.6);
      border:1px solid rgba(100,180,255,0.3);
      border-radius:24px;
      padding:40px;
      width:100%;
      max-width:460px;
      backdrop-filter:blur(16px);
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
      opacity:0;
      transform:scale(0.9);
      animation:cardIn 0.8s forwards 1.3s;
    }
    @keyframes cardIn{
      to{opacity:1;transform:scale(1);}
    }

    button,.btn{
      background:transparent;
      border:2px solid #64b4ff;
      color:#64b4ff;
      padding:16px 40px;
      margin:12px;
      font-size:1.1rem;
      border-radius:50px;
      cursor:pointer;
      transition:all 0.4s ease;
      font-weight:600;
      position:relative;
      overflow:hidden;
    }
    button::before{
      content:'';
      position:absolute;
      top:0;left:-100%;
      width:100%;height:100%;
      background:linear-gradient(90deg,transparent,#64b4ff,transparent);
      transition:0.6s;
    }
    button:hover::before{left:100%;}
    button:hover{
      background:#64b4ff;
      color:#000;
      transform:translateY(-4px);
      box-shadow:0 10px 30px rgba(100,180,255,0.4);
    }

    #video{
      width:100%;
      max-width:420px;
      border-radius:20px;
      margin:20px 0;
      border:3px solid #64b4ff;
      box-shadow:0 0 40px rgba(100,180,255,0.4);
      opacity:0;
      transform:scale(0.95);
      animation:fadeIn 0.6s forwards;
    }

    .face{
      width:190px;
      height:190px;
      border-radius:50%;
      object-fit:cover;
      border:7px solid #64b4ff;
      box-shadow:0 0 50px rgba(100,180,255,0.6);
      margin:25px auto;
      opacity:0;
      transform:scale(0);
      animation:pop 0.8s forwards 0.3s;
    }
    @keyframes pop{
      to{opacity:1;transform:scale(1);}
    }

    .shape{
      font-size:3.8rem;
      font-weight:700;
      color:#fff;
      margin:15px 0;
      text-shadow:0 0 30px #64b4ff;
      opacity:0;
      transform:translateY(20px);
      animation:slideUp 0.8s forwards 0.6s;
    }
    @keyframes slideUp{to{opacity:1;transform:translateY(0);}}

    .list{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:14px;
      margin:35px 0;
    }
    .item{
      background:rgba(100,180,255,0.15);
      padding:16px;
      border-radius:14px;
      font-size:1rem;
      border:1px solid rgba(100,180,255,0.3);
      opacity:0;
      transform:translateY(30px);
      animation:fadeUp 0.6s forwards;
    }
    .item:nth-child(1){animation-delay:0.1s}
    .item:nth-child(2){animation-delay:0.2s}
    .item:nth-child(3){animation-delay:0.3s}
    .item:nth-child(4){animation-delay:0.4s}
    .item:nth-child(5){animation-delay:0.5s}
    .item:nth-child(6){animation-delay:0.6s}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
  </style>
</head>
<body>

<h1>COCOKRAMBUT</h1>
<p class="subtitle">Deteksi bentuk wajah • Rekomendasi instan</p>

<div class="card" id="main">
  <div id="start">
    <label class="btn">Upload Foto <input type="file" id="up" accept="image/*" hidden></label><br>
    <button onclick="startCam()">Pakai Kamera</button>
  </div>

  <div id="cam" style="display:none">
    <video id="video" autoplay playsinline></video><br>
    <button onclick="snap()">Ambil Foto</button>
    <button onclick="location.reload()" style="border-color:#ff6b6b;color:#ff6b6b">Batal</button>
  </div>

  <div id="result" style="display:none"></div>
</div>

<canvas id="c" style="display:none"></canvas>

<script>
async function startCam(){
  document.getElementById('start').style.display='none';
  document.getElementById('cam').style.display='block';
  const v = document.getElementById('video');
  const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  v.srcObject = s;
  v.onloadedmetadata = () => v.style.opacity = 1;
}

document.getElementById('up').onchange = e=>{
  if(e.target.files[0]){
    const r = new FileReader();
    r.onload = ()=>proses(r.result);
    r.readAsDataURL(e.target.files[0]);
  }
};

function snap(){
  const v = document.getElementById('video');
  const c = document.getElementById('c');
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  v.srcObject.getTracks()[0].stop();
  proses(c.toDataURL());
}

function proses(src){
  document.getElementById('cam').style.display='none';
  const img = new Image();
  img.onload = ()=>{
    const r = img.height / img.width;
    let shape = "Oval";
    if(r > 1.5) shape = ["Persegi Panjang","Hati","Diamond"][Math.floor(Math.random()*3)];
    else if(r > 1.35) shape = Math.random()>0.5?"Hati":"Diamond";
    else if(r < 1.1) shape = "Bulat";
    else if(r < 1.2) shape = "Kotak";

    const rec = {
      "Oval":["Undercut","Pompadour","Side Part","Long Layer","Bob","Pixie"],
      "Bulat":["Pompadour Tinggi","Faux Hawk","Long Layer","Side Bangs"],
      "Kotak":["Textured Crop","Buzz Cut","Soft Layer","Long Bob"],
      "Hati":["Fringe","Curtain Bangs","Chin Bob","Side Bangs"],
      "Persegi Panjang":["Long Top","Curtain Bangs","Long Waves"],
      "Diamond":["Side Swept","Volume Top","Deep Side Part"]
    };

    document.getElementById('result').innerHTML = `
      <img src="${src}" class="face"><br>
      <div class="shape">${shape}</div>
      <p style="color:#88c0ff;margin:15px 0;font-size:1.1rem;">Hasil instan • 0.00 detik</p>
      <div class="list">
        ${rec[shape].map(x=>`<div class="item">${x}</div>`).join('')}
      </div>
      <button onclick="location.reload()" style="margin-top:30px">Coba Lagi</button>
    `;
    document.getElementById('result').style.display='block';
  };
  img.src = src;
}
</script>
</body>
</html>
