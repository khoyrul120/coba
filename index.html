<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocokRambut AI - Modern UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        /* Variabel Warna */
        :root {
            --color-primary: #00bcd4; /* Cyan Terang */
            --color-secondary: #0a1a2e; /* Biru Navy Gelap */
            --color-background: #000a16;
            --color-text: #e0f2ff;
            --color-accent: #64b4ff;
            --color-glow: #00eaff;
            --color-error: #ff6b6b;
        }

        /* Reset dan Dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-background);
            color: var(--color-text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background: radial-gradient(circle at top, var(--color-secondary) 10%, var(--color-background) 100%);
            transition: background 0.5s ease;
        }

        /* Judul Utama */
        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 200;
            letter-spacing: 12px;
            color: var(--color-text);
            text-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
            opacity: 0;
            transform: translateY(-40px);
            animation: titleIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards 0.5s;
        }

        @keyframes titleIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtitle */
        p.subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: var(--color-accent);
            margin: 15px 0 40px;
            opacity: 0;
            animation: fadeIn 1s forwards 1s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Card Kontainer */
        .card {
            background: rgba(15, 25, 50, 0.85);
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-radius: 30px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 204, 255, 0.2);
            opacity: 0;
            transform: scale(0.9);
            animation: cardIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.3s;
            position: relative;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Tombol */
        button, .btn, #switch-cam {
            background: linear-gradient(45deg, var(--color-primary), var(--color-accent));
            border: none;
            color: var(--color-background);
            padding: 18px 45px;
            margin: 10px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 700;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 204, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Tombol Upload */
        .btn {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--color-accent);
            color: var(--color-accent);
            box-shadow: none;
            transition: all 0.3s ease;
        }

        button:hover, .btn:hover, #switch-cam:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 204, 255, 0.6);
            filter: brightness(1.1);
        }
        
        /* Tombol Batal/Coba Lagi */
        button[onclick*='reload'] {
            background: transparent;
            border: 2px solid var(--color-error);
            color: var(--color-error);
            box-shadow: none;
            margin-top: 30px;
        }
        button[onclick*='reload']:hover {
            background: var(--color-error);
            color: #fff;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.5);
            transform: translateY(-2px);
        }

        /* Video / Kamera Container */
        #video-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 20px auto;
            border-radius: 24px;
            overflow: hidden;
            border: 4px solid var(--color-primary);
            box-shadow: 0 0 50px rgba(0, 204, 255, 0.5), inset 0 0 15px rgba(0, 204, 255, 0.3);
            opacity: 0;
            transform: scale(0.95);
            animation: fadeIn 0.6s forwards;
            background: #000;
        }

        #video {
            width: 100%;
            display: block;
        }

        /* Overlay Kontur Wajah */
        .face-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 3px dashed var(--color-glow);
            border-radius: 50%; /* Efek lingkaran */
            transform: scale(0.7) translateY(-10%); /* Pusatkan di area wajah */
            opacity: 0.7;
            pointer-events: none;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px var(--color-glow); }
            to { box-shadow: 0 0 30px var(--color-glow); }
        }

        /* Tombol Switch Kamera */
        #switch-cam {
            padding: 10px 15px;
            margin: 10px auto;
            background: var(--color-secondary);
            border: 2px solid var(--color-primary);
            color: var(--color-primary);
            font-size: 1rem;
            width: fit-content;
            display: block;
        }

        /* Loader/Processing */
        #processing {
            text-align: center;
            padding: 50px 0;
            display: none;
        }

        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid var(--color-primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Foto Hasil */
        .face {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid var(--color-primary);
            box-shadow: 0 0 60px rgba(0, 204, 255, 0.7);
            margin: 30px auto;
            opacity: 0;
            transform: scale(0);
            animation: pop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.3s;
        }

        @keyframes pop {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Hasil Bentuk Wajah */
        .shape {
            font-size: 4rem;
            font-weight: 800;
            color: var(--color-glow);
            margin: 10px 0 15px;
            text-shadow: 0 0 40px var(--color-glow);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s forwards 0.6s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Daftar Rekomendasi */
        .list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 30px 0 20px;
            padding: 10px;
        }

        .item {
            background: rgba(100, 180, 255, 0.1);
            padding: 18px;
            border-radius: 18px;
            font-size: 1.05rem;
            border: 1px solid rgba(0, 204, 255, 0.2);
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
            cursor: default;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 0.6s forwards;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .item:hover {
            background: rgba(0, 204, 255, 0.15);
            border-color: var(--color-primary);
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.5);
        }

        .item:nth-child(1) { animation-delay: 0.1s }
        .item:nth-child(2) { animation-delay: 0.2s }
        .item:nth-child(3) { animation-delay: 0.3s }
        .item:nth-child(4) { animation-delay: 0.4s }
        .item:nth-child(5) { animation-delay: 0.5s }
        .item:nth-child(6) { animation-delay: 0.6s }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #4a6c8e;
            opacity: 0.8;
            text-align: center;
        }

        /* Responsif untuk Layar Kecil */
        @media (max-width: 600px) {
            h1 { letter-spacing: 8px; }
            .card { padding: 30px 20px; }
            button, .btn {
                width: 100%;
                margin: 8px 0;
                padding: 14px 20px;
            }
            .list { grid-template-columns: 1fr 1fr; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;700;800&display=swap" rel="stylesheet">
</head>
<body>

<h1>COCOKRAMBUT AI</h1>
<p class="subtitle"><i class="fas fa-magic"></i> Deteksi Bentuk Wajah &bull; Rekomendasi Gaya Rambut Instan</p>

<div class="card" id="main">
    <div id="start">
        <label class="btn">
            <i class="fas fa-upload"></i> Unggah Foto
            <input type="file" id="up" accept="image/*" hidden>
        </label>
        <button onclick="startCam('user')"><i class="fas fa-camera"></i> Gunakan Kamera</button>
    </div>

    <div id="cam" style="display:none">
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <div class="face-overlay"></div>
        </div>
        <button id="switch-cam" onclick="switchCam()"><i class="fas fa-sync-alt"></i> Ganti Kamera</button>
        <button onclick="snap()"><i class="fas fa-camera-retro"></i> Ambil Foto</button>
        <button onclick="location.reload()" style="border-color:var(--color-error);color:var(--color-error)"><i class="fas fa-times-circle"></i> Batal</button>
    </div>

    <div id="processing">
        <div class="spinner"></div>
        <p style="font-size:1.2rem;color:var(--color-primary);">AI Sedang Menganalisis Wajah Anda...</p>
        <p style="font-size:0.9rem;margin-top:10px;color:#88c0ff;">Ini hanya akan memakan waktu beberapa detik.</p>
    </div>

    <div id="result" style="display:none"></div>
</div>

<div class="footer">
    CocokRambut AI v1.2 &copy; 2025. All Rights Reserved.
</div>

<canvas id="c" style="display:none"></canvas>

<script>
    let currentFacingMode = 'user'; // 'user' (depan) atau 'environment' (belakang)
    
    // --- FUNGSI KAMERA ---
    async function startCam(facingMode) {
        document.getElementById('start').style.display = 'none';
        document.getElementById('cam').style.display = 'block';
        const v = document.getElementById('video');
        
        // Hentikan stream yang ada (jika ada)
        if (v.srcObject) {
            v.srcObject.getTracks().forEach(track => track.stop());
        }

        try {
            const s = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: facingMode 
                } 
            });
            currentFacingMode = facingMode;
            v.srcObject = s;
            v.onloadedmetadata = () => {
                // Atur opasitas setelah video siap
                document.getElementById('video-container').style.opacity = 1;
            };
        } catch (err) {
            alert('Tidak dapat mengakses kamera. Pastikan izin kamera diberikan.');
            location.reload();
        }
    }
    
    function switchCam() {
        // Toggle antara 'user' dan 'environment'
        const newFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
        startCam(newFacingMode);
    }

    // --- FUNGSI UPLOAD ---
    document.getElementById('up').onchange = e => {
        if (e.target.files[0]) {
            // Tampilkan loader sebentar
            document.getElementById('start').style.display = 'none';
            document.getElementById('processing').style.display = 'block';

            const r = new FileReader();
            r.onload = () => {
                // Simulasi proses AI (delay 1.5 detik)
                setTimeout(() => {
                    document.getElementById('processing').style.display = 'none';
                    proses(r.result);
                }, 1500);
            };
            r.readAsDataURL(e.target.files[0]);
        }
    };

    // --- FUNGSI AMBIL FOTO (SNAP) ---
    function snap() {
        const v = document.getElementById('video');
        const c = document.getElementById('c');
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);

        // Hentikan kamera dan tampilkan loader
        v.srcObject.getTracks().forEach(track => track.stop());
        document.getElementById('cam').style.display = 'none';
        document.getElementById('processing').style.display = 'block';

        // Simulasi proses AI (delay 1.5 detik)
        setTimeout(() => {
            document.getElementById('processing').style.display = 'none';
            proses(c.toDataURL());
        }, 1500);
    }

    // --- FUNGSI PEMROSESAN HASIL ---
    function proses(src) {
        const img = new Image();
        img.onload = () => {
            const r = img.height / img.width;
            let shape = "Oval";
            
            // Logika Deteksi Bentuk Wajah
            if (r > 1.5) shape = ["Persegi Panjang", "Hati", "Diamond"][Math.floor(Math.random() * 3)];
            else if (r > 1.35) shape = Math.random() > 0.5 ? "Hati" : "Diamond";
            else if (r < 1.1) shape = "Bulat";
            else if (r < 1.2) shape = "Kotak";

            // Rekomendasi Gaya Rambut
            const rec = {
                "Oval": ["Undercut", "Pompadour", "Side Part", "Long Layer", "Bob", "Pixie"],
                "Bulat": ["Pompadour Tinggi", "Faux Hawk", "Long Layer", "Side Bangs"],
                "Kotak": ["Textured Crop", "Buzz Cut", "Soft Layer", "Long Bob"],
                "Hati": ["Fringe", "Curtain Bangs", "Chin Bob", "Side Bangs"],
                "Persegi Panjang": ["Long Top", "Curtain Bangs", "Long Waves"],
                "Diamond": ["Side Swept", "Volume Top", "Deep Side Part"]
            };

            // Tampilkan Hasil
            document.getElementById('result').innerHTML = `
                <img src="${src}" class="face" alt="Wajah yang dideteksi"><br>
                <p style="color:var(--color-accent);margin-bottom:5px;font-size:1.1rem;font-weight:600;"><i class="fas fa-star"></i> Bentuk Wajah Anda</p>
                <div class="shape">${shape}</div>
                <p style="color:#88c0ff;margin:15px 0;font-size:1rem;opacity:0.8;">Waktu proses: 1.50 detik</p>
                
                <p style="color:var(--color-primary);font-size:1.2rem;font-weight:700;margin-top:25px;margin-bottom:10px;"><i class="fas fa-cut"></i> Gaya Rambut yang Direkomendasikan:</p>
                <div class="list">
                    ${rec[shape].map(x => `<div class="item">${x}</div>`).join('')}
                </div>
                <button onclick="location.reload()" style="margin-top:30px;border-color:var(--color-error);color:var(--color-error)"><i class="fas fa-redo"></i> Coba Lagi</button>
            `;
            document.getElementById('result').style.display = 'block';
        };
        img.src = src;
    }
</script>
</body>
</html>
