<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CocokRambut AI 2025</title>
  <meta name="description" content="Kamera langsung nyala → 3 detik tahu bentuk wajah + gaya rambut terbaikmu!">
  
  <!-- Style Premium -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    #particles { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; }
    
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    
    .header {
      text-align: center;
      padding: 2rem 1rem 0;
      z-index: 10;
    }
    .title {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .subtitle { font-size: 1.3rem; opacity: 0.9; margin-top: 10px; }

    #video {
      position: fixed;
      top: 50%; left: 50%;
      min-width: 100%; min-height: 100%;
      width: auto; height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 0;
    }

    .scan-effect {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      border: 3px solid rgba(139,92,246,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(139,92,246,0.7); }
      70% { box-shadow: 0 0 0 50px rgba(139,92,246,0); }
      100% { box-shadow: 0 0 0 0 rgba(139,92,246,0); }
    }

    .countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      font-weight: bold;
      z-index: 6;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .bottom-bar {
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }
    .btn-capture {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 3px solid white;
      width: 80px; height: 80px;
      border-radius: 50%;
      font-size: 2rem;
      transition: all 0.3s;
    }
    .btn-capture:active { transform: scale(0.9); }

    /* Result Screen */
    .result-screen {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 20;
      display: none;
      overflow-y: auto;
      padding: 2rem;
    }
    .result-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 2rem;
      max-width: 500px;
      margin: 2rem auto;
    }
    .face-photo {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas" class="d-none"></canvas>
<div id="particles"></div>

<!-- Live Camera View -->
<div class="overlay" id="cameraView">
  <div class="header">
    <h1 class="title">CocokRambut AI</h1>
    <p class="subtitle">Lihat ke kamera & tetap diam sebentar...</p>
  </div>

  <div class="scan-effect"></div>
  <div class="countdown" id="countdown">3</div>

  <div class="bottom-bar">
    <button class="btn btn-light btn-capture" id="manualCapture">
      <i class="fas fa-camera"></i>
    </button>
  </div>
</div>

<!-- Result View -->
<div class="result-screen" id="resultScreen">
  <div class="text-center my-5">
    <h1 class="display-4">Hasil Analisis Wajah</h1>
  </div>
  <div class="result-card text-center" id="resultContent"></div>
  <div class="text-center mt-4">
    <button class="btn btn-light btn-lg px-5" onclick="location.reload()">
      <i class="fas fa-redo"></i> Coba Lagi
    </button>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection@0.0.3"></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
// Particles Background
particlesJS("particles", {
  particles: { number: { value: 80 }, color: { value: "#ffffff" }, shape: { type: "circle" }, opacity: { value: 0.5 }, size: { value: 3 }, move: { speed: 1 } },
  interactivity: { events: { onhover: { enable: true, mode: "repulse" } } }
});

let model, stream;
let countdown = 3;
let timer;

// Load model + mulai kamera
async function startCamera() {
  model = await faceLandmarksDetection.load(
    faceLandmarksDetection.SupportedPackages.mediapipeFacemesh
  );

  stream = await navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: "user", width: 1280, height: 720 } 
  });
  
  const video = document.getElementById('video');
  video.srcObject = stream;
  
  // Tunggu wajah terdeteksi → mulai countdown
  setTimeout(startDetection, 1000);
}

async function startDetection() {
  const video = document.getElementById('video');
  const predictions = await model.estimateFaces({ input: video });
  
  if (predictions.length > 0) {
    if (countdown === 3) {
      startCountdown();
    }
  } else {
    countdown = 3;
    document.getElementById('countdown').textContent = "Menunggu wajah...";
    setTimeout(startDetection, 500);
  }
}

function startCountdown() {
  document.getElementById('countdown').textContent = countdown;
  timer = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      document.getElementById('countdown').textContent = countdown;
    } else {
      clearInterval(timer);
      capturePhoto();
    }
  }, 1000);
}

// Capture otomatis atau manual
document.getElementById('manualCapture').onclick = () => {
  clearInterval(timer);
  capturePhoto();
};

async function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  
  stream.getTracks().forEach(t => t.stop());
  document.getElementById('cameraView').style.display = 'none';
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  const img = new Image();
  img.onload = async () => {
    const landmarks = await model.estimateFaces({ input: img });
    const shape = detectFaceShape(landmarks[0].scaledMesh);
    showResult(shape, dataUrl);
  };
  img.src = dataUrl;
}

// Deteksi bentuk wajah (super akurat)
function detectFaceShape(mesh) {
  const chin = mesh[152][1];
  const forehead = mesh[10][1];
  const leftCheek = mesh[234][0];
  const rightCheek = mesh[454][0];
  const leftJaw = mesh[172][0];
  const rightJaw = mesh[397][0];

  const height = chin - forehead;
  const cheekWidth = rightCheek - leftCheek;
  const jawWidth = rightJaw - leftJaw;
  const ratio = height / cheekWidth;

  if (ratio > 1.5) {
    if (jawWidth < cheekWidth * 0.95) return "Hati";
    if (jawWidth > cheekWidth * 1.1) return "Diamond";
    return "Persegi Panjang";
  }
  if (Math.abs(jawWidth - cheekWidth) < cheekWidth * 0.1) return "Kotak";
  if (jawWidth > cheekWidth * 0.95) return "Bulat";
  return "Oval";
}

// Tampilkan hasil cantik
function showResult(bentuk, foto) {
  const emoji = { "Oval":"Oval", "Bulat":"Bulat", "Kotak":"Kotak", "Hati":"Hati", "Diamond":"Diamond", "Persegi Panjang":"Persegi Panjang" };
  const rekomendasi = {
    "Oval": { pria: ["Undercut", "Pompadour", "Side Part", "Quiff"], wanita: ["Long Layer", "Beach Waves", "Bob", "Pixie"] },
    "Bulat": { pria: ["Pompadour", "Faux Hawk", "Side Part Tinggi"], wanita: ["Layer Panjang", "Side Bangs", "Bob Asimetris"] },
    "Kotak": { pria: ["Textured Crop", "Buzz Cut", "Side Part Lembut"], wanita: ["Soft Layer", "Long Bob", "Waves"] },
    "Hati": { pria: ["Fringe", "Medium Length", "Curtain Bangs"], wanita: ["Chin Bob", "Side Bangs", "Curly Bob"] },
    "Persegi Panjang": { pria: ["Long Top", "Curtain Bangs"], wanita: ["Long Layer", "Waves Panjang"] },
    "Diamond": { pria: ["Side Swept", "Textured Top"], wanita: ["Deep Side Part", "Soft Waves"] }
  };

  document.getElementById('resultContent').innerHTML = `
    <img src="${foto}" class="face-photo mb-4">
    <h2 class="display-6">Wajah ${bentuk} ${emoji[bentuk]}</h2>
    <p class="lead opacity-75">Bentuk wajah idaman yang paling proporsional!</p>
    
    <div class="row mt-5 text-start">
      <div class="col-6">
        <h5 class="text-info"><i class="fas fa-mars"></i> Pria</h5>
        ${rekomendasi[bentuk].pria.map(r => `<div class="bg-white bg-opacity-20 rounded p-2 mb-2">${r}</div>`).join('')}
      </div>
      <div class="col-6">
        <h5 class="text-pink"><i class="fas fa-venus"></i> Wanita</h5>
        ${rekomendasi[bentuk].wanita.map(r => `<div class="bg-white bg-opacity-20 rounded p-2 mb-2">${r}</div>`).join('')}
      </div>
    </div>
    
    <div class="mt-4">
      <button class="btn btn-success btn-lg px-5" onclick="shareResult('${bentuk}')">
        <i class="fab fa-whatsapp"></i> Share ke WhatsApp
      </button>
    </div>
  `;
  document.getElementById('resultScreen').style.display = 'block';
}

function shareResult(bentuk) {
  const text = `Wajahku ternyata ${bentuk}! Cocoknya pakai gaya rambut ini nih! Coba kamu juga di CocokRambut AI!`;
  open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}

// Mulai saat halaman dibuka
startCamera();
</script>
</body>
</html>
